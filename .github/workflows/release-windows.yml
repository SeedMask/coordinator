name: Windows release build

# Builds Windows x64 installers only. Does not build or replace macOS artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub Release tag to attach Windows assets to (e.g. v1.0.4). Leave empty to upload Actions artifacts only."
        required: false
        default: "v1.0.4"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # MSVC (VS2026) rejects deprecated experimental coroutines used by @abandonware/noble.
      _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: electron
        shell: bash
        env:
          # Passed through to cl.exe / MSBuild for the noble WinRT binding.
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          npm_config_python: python
        run: |
          set -euo pipefail
          echo "cwd=$(pwd)"
          node -v
          npm -v
          python --version

          # Skip install scripts first: @abandonware/noble (Ledger BLE) fails to compile
          # against VS2026 without the silence flag, and even then is fragile.
          # We install Electron manually, then rebuild only USB/HID natives.
          npm ci --no-fund --no-audit --ignore-scripts

          echo "Downloading Electron binary…"
          node node_modules/electron/install.js

          if [[ -f node_modules/esbuild/install.js ]]; then
            node node_modules/esbuild/install.js
          fi

          echo "Rebuilding usb / node-hid for Electron (Ledger USB)…"
          npx electron-rebuild -f -w usb,node-hid

          # Optional BLE stacks — do not fail the Windows preview build if WinRT BLE
          # bindings refuse to compile on this runner toolchain.
          echo "Attempting BLE native rebuild (optional on Windows preview)…"
          npx electron-rebuild -f -w @stoprocent/noble,@stoprocent/bluetooth-hci-socket \
            || echo "warn: @stoprocent BLE rebuild skipped"
          CL="/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS" \
            npx electron-rebuild -f -w @abandonware/noble \
            || echo "warn: @abandonware/noble WinRT rebuild skipped (Ledger BLE over Bluetooth may be unavailable on this Windows build)"

          test -d node_modules/electron
          test -d node_modules/electron-builder
          test -d node_modules/electron-vite
          echo "node_modules ok"

      - name: Build Windows x64 release
        working-directory: electron
        shell: bash
        env:
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
        run: |
          set -euo pipefail
          npm run release 2>&1 | tee release-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-build-log
          path: electron/release-build.log
          if-no-files-found: ignore

      - name: List release outputs
        if: always()
        working-directory: electron
        shell: bash
        run: |
          ls -la release/ || true
          ls -la release/*win* release/*.exe release/*.zip release/latest.yml 2>/dev/null || true

      - name: Upload Actions artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seedmask-coordinator-windows-x64
          path: |
            electron/release/*win*
            electron/release/*.exe
            electron/release/latest.yml
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: >-
          success() && (
            startsWith(github.ref, 'refs/tags/') ||
            (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
          )
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: |
            electron/release/*win*
            electron/release/*.exe
            electron/release/latest.yml
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
