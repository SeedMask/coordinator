name: Windows release build

# Builds Windows x64 installers only. Does not build or replace macOS artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub Release tag to attach Windows assets to (e.g. v1.0.5). Leave empty to upload Actions artifacts only."
        required: false
        default: "v1.0.5"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: electron
        shell: bash
        env:
          npm_config_python: python
          # Prevent Git Bash from rewriting flags that look like Unix paths (e.g. /D...).
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          set -euo pipefail
          echo "cwd=$(pwd)"
          node -v
          npm -v
          python --version

          # Skip install scripts during npm ci (natives rebuilt explicitly below).
          npm ci --no-fund --no-audit --ignore-scripts

          echo "Downloading Electron binary…"
          node node_modules/electron/install.js

          if [[ -f node_modules/esbuild/install.js ]]; then
            node node_modules/esbuild/install.js
          fi

          echo "Patching Windows noble WinRT gyp (VS2026 coroutine silence)…"
          node scripts/patch_windows_noble_gyp.mjs

          echo "Rebuilding usb / node-hid / noble for Electron (USB + BLE)…"
          # Controlled rebuild only — package:win keeps npmRebuild=false so
          # electron-builder does not run a second full rebuild.
          npx electron-rebuild -f --only usb,node-hid,@abandonware/noble,@stoprocent/noble

          test -d node_modules/electron
          test -d node_modules/electron-builder
          test -d node_modules/electron-vite
          echo "node_modules ok"

      - name: Build Windows x64 release
        working-directory: electron
        shell: bash
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          set -euo pipefail
          npm run release 2>&1 | tee release-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-build-log
          path: electron/release-build.log
          if-no-files-found: ignore

      - name: List release outputs
        if: always()
        working-directory: electron
        shell: bash
        run: |
          ls -la release/ || true
          ls -la release/*win* release/*.exe release/*.zip release/latest.yml 2>/dev/null || true

      - name: Upload Actions artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seedmask-coordinator-windows-x64
          path: |
            electron/release/*win*
            electron/release/*.exe
            electron/release/latest.yml
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: >-
          success() && (
            startsWith(github.ref, 'refs/tags/') ||
            (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
          )
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: SeedMask Coordinator 1.0.5
          body_path: .github/release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            electron/release/*win*
            electron/release/*.exe
            electron/release/latest.yml
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
