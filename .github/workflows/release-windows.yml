name: Windows release build

# Builds Windows x64 installers only. Does not build or replace macOS artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub Release tag to attach Windows assets to (e.g. v1.0.4). Leave empty to upload Actions artifacts only."
        required: false
        default: "v1.0.4"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Allow native / electron install scripts on stock npm (package.json allowScripts is a local hardening list).
      npm_config_ignore_scripts: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\electron" || exit /b 1
          echo cwd=%CD%
          dir
          where node
          where npm
          node -v
          npm -v
          if not exist package-lock.json (
            echo missing package-lock.json
            exit /b 1
          )
          npm ci --no-fund --no-audit
          if errorlevel 1 (
            echo npm ci failed — falling back to npm install
            npm install --no-fund --no-audit
          )

      - name: Build Windows x64 release
        working-directory: electron
        shell: bash
        run: |
          set -euo pipefail
          pwd
          npm run release

      - name: List release outputs
        working-directory: electron
        shell: bash
        run: |
          ls -la release/ || true
          ls -la release/*win* release/*.exe release/*.zip release/latest.yml 2>/dev/null || true

      - name: Upload Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seedmask-coordinator-windows-x64
          path: |
            electron/release/*win*
            electron/release/*.exe
            electron/release/latest.yml
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: |
            electron/release/*win*
            electron/release/*.exe
            electron/release/latest.yml
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
